<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SQL Injection Defense</title><link rel="stylesheet" href="/static/style.css"><main><h1>SQL Injection Defense Demo</h1><p>Parameterized ORM queries, hashed passwords, AES-256-GCM encrypted notes, session + capability access.</p><form id="register"><h2>Register</h2><input name="username" placeholder="Username" required><input name="password" type="password" placeholder="Password (12+ characters)" required minlength="12"><textarea name="note" placeholder="Sensitive note"></textarea><button>Register</button></form><form id="login"><h2>Login</h2><input name="username" placeholder="Username" required><input name="password" type="password" placeholder="Password" required><button>Login</button></form><button id="view">View encrypted note (authenticated)</button><pre id="result" aria-live="polite"></pre></main><script>let capability='';async function send(path,form){let r=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(form)))});let d=await r.json();document.querySelector('#result').textContent=JSON.stringify(d,null,2);return d}document.querySelector('#register').onsubmit=async e=>{e.preventDefault();await send('/api/register',e.target)};document.querySelector('#login').onsubmit=async e=>{e.preventDefault();let d=await send('/api/login',e.target);capability=d.capability||''};document.querySelector('#view').onclick=async()=>{let r=await fetch('/api/note',{headers:{'X-Capability':capability}});document.querySelector('#result').textContent=JSON.stringify(await r.json(),null,2)}</script></html>
